# ===============================
# CONFIGURAÇÃO DO SERVIDOR
# ===============================
server.port=8080

# ===============================
# CONFIGURAÇÃO DO POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=12345678

# ===============================
# CONFIGURAÇÃO DO HIBERNATE (JPA)
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=festividades
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONFIGURAÇÃO DE SEGURANÇA E JWT
# ===============================
# Nota: O JWT precisa de uma chave forte (pelo menos 256 bits / 32 caracteres)
api.security.token.secret=festividades_transparencia_tce_ce_secret_key_2026_super_segura