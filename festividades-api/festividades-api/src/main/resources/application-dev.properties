# ===============================
# SERVIDOR
# ===============================
server.port=8080
# Atrás de proxy: usa X-Forwarded-For SOMENTE se o proxy sobrescrever o cabeçalho.
server.forward-headers-strategy=framework
# Não vazar detalhes de erro
server.error.include-message=never
server.error.include-stacktrace=never

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# HIBERNATE (JPA)
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=festividades
spring.jpa.open-in-view=false

# ===============================
# SEGURANÇA
# ===============================
api.security.token.secret=${JWT_SECRET}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===============================
# IMPORTAÇÃO
# ===============================
# IPs autorizados para importar planilhas.
# Configurado diretamente na variável IMPORT_ALLOWED_IPS.

